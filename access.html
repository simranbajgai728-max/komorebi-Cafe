<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喫茶こもれび | アクセス・営業時間</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 🌟 Contact page jastै सफा, आधुनिक र युनिक कार्ड डिजाइन */
    .access-container {
      max-width: 700px;
      margin: 7rem auto 3rem auto;
      padding: 0 1.5rem;
    }

    .access-card {
      background: var(--nav-bg, #ffffff);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.06);
      margin-bottom: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .access-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .access-card h2 {
      font-size: 1.4rem;
      color: var(--primary-color, #333);
      margin-top: 0;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .access-info-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .access-info-list li {
      margin-bottom: 0.8rem;
      line-height: 1.8;
      color: #555;
      font-size: 1rem;
    }

    .access-info-list li strong {
      color: var(--primary-color, #333);
      display: inline-block;
      width: 130px;
    }
  </style>
</head>
<body>

  <!-- माथिको हेडर -->
  <header class="about-header" style="text-align: center; padding: 1.2rem 1rem;">
    <h1 style="font-size: 1.8rem; margin-bottom: 0.2rem; color: var(--primary-color);">喫茶こもれび</h1>
    <p style="color: #666; font-size: 0.9rem; margin: 0;">アクセスおよび営業時間のご案内</p>
  </header>

  <!-- नेभिगेसन बार -->
  <nav aria-label="サイト内メニュー">
    
    <ul class="nav-list" id="navList">
      <li><a href="index.html">トップ</a></li>
      <li><a href="menu.html">メニュー</a></li>
      <li><a href="about.html">お店について</a></li>
      <li><a href="access.html" class="active">アクセス・営業時間</a></li>
      <li><a href="contact.html">お問い合わせ</a></li>
    </ul>
  </nav>

  <!-- मुख्य कन्टेन्ट (Contact page jastai alag-alag card sections) -->
  <main class="access-container">
    
    <!-- 1. 営業時間と定休日 Card -->
    <div class="access-card">
      <h2>⏰ 営業時間と定休日</h2>
      <ul class="access-info-list">
        <li><strong>営業時間：</strong>10:00〜18:00</li>
        <li><strong>定休日：</strong>水曜日</li>
        <li><strong>ラストオーダー：</strong>17:30</li>
      </ul>
    </div>

    <!-- 2. アクセス（場所） Card -->
    <div class="access-card">
      <h2>📍 アクセス（場所）</h2>
      <ul class="access-info-list">
        <li><strong>住所：</strong>緑町1丁目3-5（課題用の架空住所）</li>
        <li><strong>最寄り駅：</strong>緑町駅から徒歩7分</li>
        <li><strong>駐車場：</strong>なし（近隣のコインパーキングをご利用ください）</li>
      </ul>
    </div>

  </main>

  <!-- तल्लो भाग -->
  <footer>
    <small>&copy; 喫茶こもれび All Rights Reserved.</small>
  </footer>

  <!-- मोबाइल मेनु स्क्रिप्ट -->
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const navList = document.getElementById('navList');

    if (menuToggle && navList) {
      menuToggle.addEventListener('click', function() {
        navList.classList.toggle('active');
      });
    }
  </script>

</body>
</html>
